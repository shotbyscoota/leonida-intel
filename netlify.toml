# Netlify settings for the existing "gtadropz" site (https://gtadropz.netlify.app).
# Static site: nothing to build, Netlify serves dist/ as-is.
[build]
  publish = "dist"
  # Deploy only when something the site serves changed. Commits that touch only the scan ledger
  # (data/), the creator kit, docs or tests are skipped, so they cost no deploy.
  # Exit 1 = build, exit 0 = skip. The first build (no cached ref yet) always builds.
  ignore = "if [ -z \"$CACHED_COMMIT_REF\" ] || [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ]; then exit 1; fi; git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- dist/ netlify.toml"

# The feed must never be served stale from a browser cache.
[[headers]]
  for = "/data/feed.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
